{% extends "base.html" %}
{% block content %}

<h2>🧾 ใบสเตป</h2>

<form method="POST" action="/place_bet">

<table class="table table-dark">
<tr>
<th>คู่แข่งขัน</th>
<th>เลือก</th>
<th>ราคา</th>
</tr>

{% for s in selections %}
<tr>
<td>{{ s.match.home }} vs {{ s.match.away }}</td>
<td>{{ s.choice }}</td>
<td>{{ s.odds }}</td>
</tr>
<input type="hidden" name="selection" value="{{ s.value }}">
{% endfor %}

</table>

<h4 class="text-success">ราคาคูณรวม: {{ total_odds }}</h4>

<input type="number" name="stake"
class="form-control mb-2"
placeholder="ใส่จำนวนเงิน" required>

<button class="btn btn-danger w-100">
ยืนยันเดิมพัน
</button>

</form>

{% endblock %}
