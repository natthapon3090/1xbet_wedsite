<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Football Bet System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
<a class="navbar-brand" href="/">BET SYSTEM</a>
<div>
<a href="/leagues" class="btn btn-success">แทงบอล</a>
<a href="/history" class="btn btn-warning">ประวัติ</a>
<a href="/wallet" class="btn btn-info">กระเป๋า</a>
<a href="/login" class="btn btn-primary">Login</a>
</div>
</nav>

<div class="container mt-4">
{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="alert alert-info">
{% for msg in messages %}
<p>{{ msg }}</p>
{% endfor %}
</div>
{% endif %}
{% endwith %}

{% block content %}{% endblock %}
</div>

</body>
</html>
