{% extends "base.html" %}
{% block content %}
<h2>ประวัติการเดิมพัน</h2>
<table class="table table-dark">
<tr>
<th>Stake</th>
<th>Odds</th>
<th>Win</th>
</tr>
{% for b in bets %}
<tr>
<td>{{ b.stake }}</td>
<td>{{ b.total_odds }}</td>
<td>{{ b.potential_win }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
